# Cloudflare Worker config (SCAFFOLD): API + Claude proxy + the Brain.
name = "memory"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# PWA served as static assets from the same Worker.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 (SQLite). Create with `wrangler d1 create memory`, paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "memory"
database_id = "886eb3e6-5fc6-4b1c-8703-856b76103b57"

[vars]
CLAUDE_MODEL = "claude-sonnet-4-6"

# Daily Brain rebuild. Cron is UTC — pick a time that lands in the user's early
# morning. TODO: confirm cadence/time with the user.
[triggers]
crons = ["0 11 * * *"]

# --- Bindings to enable as features land --------------------------------------
# Semantic search (worker/search.ts):
#   [ai]
#   binding = "AI"                       # Workers AI for embeddings
#   [[vectorize]]
#   binding = "VECTORIZE"
#   index_name = "memory-content"        # wrangler vectorize create ...
#
# Secrets (wrangler secret put / dashboard):
#   CLAUDE_API_KEY        enables smart capture + the Brain
#   AUTH_TOKEN            optional single-user bearer token
#   GOOGLE_CLIENT_ID      Google Calendar OAuth (worker/calendar.ts)
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN  one-time consent, stored server-side
